[package]
name = "omarchy-batch-monitor"
version = "0.1.0"
edition = "2021"
description = "A terminal UI for monitoring OpenAI Batch API job statuses"
license = "MIT"

[[bin]]
name = "obm"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
anyhow = "1"
directories = "5"
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
strip = true
